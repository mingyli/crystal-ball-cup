# This workflow runs on pull requests to check the build, tests, and formatting.
name: CI Checks

on:
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1.1"
          dune-cache: true

      - name: Install system dependencies (XeTeX and wget)
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex wget

      - name: Cache Pandoc
        id: cache-pandoc
        uses: actions/cache@v4
        with:
          path: pandoc-3.7.0.2-1-amd64.deb
          key: pandoc-3.7.0.2

      - name: Download Pandoc
        if: steps.cache-pandoc.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/jgm/pandoc/releases/download/3.7.0.2/pandoc-3.7.0.2-1-amd64.deb

      - name: Install Pandoc
        run: |
          sudo dpkg -i pandoc-3.7.0.2-1-amd64.deb
          sudo apt-get -f install -y

      - name: Install dependencies and build
        run: |
          opam install . --deps-only --with-test
          eval $(opam env)
          dune build
          dune runtest

      - name: Check formatting with ocamlformat
        run: |
          eval $(opam env)
          dune fmt

      - name: Check for unclean workspace
        run: git diff --exit-code
