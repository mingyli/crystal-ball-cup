# This workflow runs on pull requests to check formatting, build, and tests.
name: CI Checks

on:
  pull_request:

jobs:
  check-format:
    name: Check Formatting
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1.1"
          dune-cache: true

      - name: Install ocamlformat
        run: |
          opam install ocamlformat
          eval $(opam env)

      - name: Format code with dune fmt
        run: |
          eval $(opam env)
          dune fmt

      - name: Verify clean git diff
        run: git diff --exit-code

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.1.1"
          dune-cache: true

      - name: Install system dependencies (XeTeX and wget)
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex wget

      - name: Cache Pandoc
        id: cache-pandoc
        uses: actions/cache@v4
        with:
          path: pandoc-3.7.0.2-1-amd64.deb
          key: pandoc-3.7.0.2

      - name: Download Pandoc
        if: steps.cache-pandoc.outputs.cache-hit != 'true'
        run: |
          wget https://github.com/jgm/pandoc/releases/download/3.7.0.2/pandoc-3.7.0.2-1-amd64.deb

      - name: Install Pandoc
        run: |
          sudo dpkg -i pandoc-3.7.0.2-1-amd64.deb
          sudo apt-get -f install -y

      - name: Install project dependencies
        run: |
          opam install . --deps-only --with-test
          eval $(opam env)

      - name: Build project
        run: |
          eval $(opam env)
          dune build

      - name: Run tests
        run: |
          eval $(opam env)
          dune runtest
